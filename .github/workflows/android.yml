name: Android build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name
        required: true
        default: 1.0.0
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum diisi" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Set version
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"

      - name: Build AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: gradle --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bgremover-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
